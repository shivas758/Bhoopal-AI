<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the chat box and bottom bar move above the Android keyboard instead of hiding under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Free farming help: mandi prices, weather, crop advice and government schemes in 6 Indian languages." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#15803d" />
    <!-- Preview when the link is shared on WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BhooPal – free farming helper" />
    <meta property="og:description" content="Mandi prices, weather, crop advice and government schemes. हिन्दी · తెలుగు · தமிழ் · ಕನ್ನಡ · മലയാളം · English" />
    <meta property="og:image" content="https://bhoopal.shivasahith.workers.dev/pwa-512x512.png" />
    <meta property="og:url" content="https://bhoopal.shivasahith.workers.dev/" />
    <meta name="twitter:card" content="summary" />
    <title>BhooPal – Farm Helper</title>
    <style>
      /* Shown until the app has loaded (seconds on 2G); React replaces it. */
      body {
        margin: 0;
        background: #f7f7f2;
        font-family: system-ui, sans-serif;
        color: #1c1917;
      }
      .splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      .splash b {
        font-size: 24px;
        color: #166534;
      }
      .splash i {
        width: 28px;
        height: 28px;
        border: 3px solid #bbf7d0;
        border-top-color: #15803d;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash i {
          animation: none;
        }
      }
      .old-browser {
        padding: 24px;
        max-width: 480px;
        margin: 0 auto;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="/logo.svg" alt="" />
        <b>BhooPal</b>
        <i></i>
      </div>
    </div>
    <noscript>Please enable JavaScript to use BhooPal.</noscript>
    <!-- Plain old JavaScript: shows a "please update Chrome" message on browsers too old for the app. -->
    <script src="/browser-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
